[package]
name = "vistaar-super-admin"
version = "3.1.0"
description = "VISTAAR Super Admin - Authoritative Cloud Control Plane"
authors = ["VISTAAR Administrative Security"]
edition = "2021"

[lib]
name = "vistaar_super_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-notification = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
